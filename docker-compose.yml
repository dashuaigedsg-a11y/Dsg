x-erpnext-image: &erpnext_image
  image: frappe/erpnext:v15.77.0
  platform: linux/amd64
  restart: unless-stopped

x-bench-volumes: &bench_volumes
  - sites:/home/frappe/frappe-bench/sites
  - ./apps/dsg_wholesale:/home/frappe/frappe-bench/apps/dsg_wholesale

services:
  db:
    image: mariadb:10.6
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
    environment:
      MYSQL_ROOT_PASSWORD: frappe
      MARIADB_ROOT_PASSWORD: frappe
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped

  configurator:
    <<: *erpnext_image
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes: *bench_volumes
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
    entrypoint: ["bash", "-c"]
    command:
      - >
        printf 'frappe\nerpnext\ndsg_wholesale\n' > sites/apps.txt;
        bench set-config -g db_host "$${DB_HOST}";
        bench set-config -gp db_port "$${DB_PORT}";
        bench set-config -g redis_cache "redis://$${REDIS_CACHE}";
        bench set-config -g redis_queue "redis://$${REDIS_QUEUE}";
        bench set-config -g redis_socketio "redis://$${REDIS_QUEUE}";
        bench set-config -gp socketio_port 9000;
        echo 'Frappe configurator complete';

  create-site:
    <<: *erpnext_image
    restart: "no"
    depends_on:
      configurator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    volumes: *bench_volumes
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    entrypoint: ["bash", "-c"]
    command:
      - >
        if [ ! -f sites/dsg.local/site_config.json ]; then
          bench new-site dsg.local
          --db-root-username root
          --db-root-password frappe
          --mariadb-user-host-login-scope '%'
          --admin-password admin
          --install-app erpnext;
        fi;
        if ! bench --site dsg.local list-apps | grep -qx dsg_wholesale; then
          bench --site dsg.local install-app dsg_wholesale;
        fi;
        bench --site dsg.local set-config developer_mode 1;
        bench --site dsg.local set-config mute_emails 1;
        bench --site dsg.local clear-cache;
        echo 'ERPNext wholesale demo site ready';

  backend:
    <<: *erpnext_image
    depends_on:
      create-site:
        condition: service_completed_successfully
    volumes: *bench_volumes
    environment:
      GUNICORN_THREADS: "4"
      GUNICORN_WORKERS: "2"
      GUNICORN_TIMEOUT: "120"

  frontend:
    <<: *erpnext_image
    depends_on:
      - backend
      - websocket
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    ports:
      - "8000:8080"
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: dsg.local
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 50m
    command:
      - nginx-entrypoint.sh

  websocket:
    <<: *erpnext_image
    depends_on:
      create-site:
        condition: service_completed_successfully
    volumes: *bench_volumes
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js

  queue-short:
    <<: *erpnext_image
    depends_on:
      create-site:
        condition: service_completed_successfully
    volumes: *bench_volumes
    command: bench worker --queue short,default

  queue-long:
    <<: *erpnext_image
    depends_on:
      create-site:
        condition: service_completed_successfully
    volumes: *bench_volumes
    command: bench worker --queue long,default,short

  scheduler:
    <<: *erpnext_image
    depends_on:
      create-site:
        condition: service_completed_successfully
    volumes: *bench_volumes
    command: bench schedule

volumes:
  db-data:
  sites:
